services:
  obsidian-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: codingagent-obsidian-mcp:2.0.1
    container_name: codingagent-obsidian-mcp
    user: "${OBSIDIAN_UID:-1000}:${OBSIDIAN_GID:-1000}"
    restart: unless-stopped
    init: true
    volumes:
      - ./obsidian-vault:/vault
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -d /vault/.obsidian && command -v obsidian-mcp >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  playwright:
    image: mcr.microsoft.com/playwright/mcp:v0.0.83
    container_name: codingagent-playwright
    restart: unless-stopped
    init: true
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - 127.0.0.1:8931
      - --output-dir
      - /workspace/test-results
    ports:
      - "127.0.0.1:8931:8931"
    volumes:
      - ./workspace:/workspace
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('node:net').createConnection(8931,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5

volumes: {}
