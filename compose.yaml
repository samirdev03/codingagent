services:
  codingagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: codingagent-opencode:2.0.7
    container_name: codingagent
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4096:4096"
    env_file:
      - .env
    environment:
      HOME: /home/opencode
      XDG_CONFIG_HOME: /home/opencode/.config
      XDG_DATA_HOME: /home/opencode/.local/share
      XDG_CACHE_HOME: /home/opencode/.cache
      GH_CONFIG_DIR: /home/opencode/.local/share/opencode/github-cli
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID in .env}
      DISCORD_ALLOW_WRITES: ${DISCORD_ALLOW_WRITES:-false}
      DISCORD_ALLOW_DESTRUCTIVE_ADMIN: ${DISCORD_ALLOW_DESTRUCTIVE_ADMIN:-false}
      DISCORD_ALLOWED_CHANNEL_IDS: ${DISCORD_ALLOWED_CHANNEL_IDS:-}
    volumes:
      - ./workspace:/workspace
      - opencode-config:/home/opencode/.config/opencode
      - opencode-data:/home/opencode/.local/share/opencode
      - opencode-cache:/home/opencode/.cache/opencode
      - opencode-tools:/home/opencode/.local/tools
    depends_on:
      - playwright
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  playwright:
    image: mcr.microsoft.com/playwright/mcp
    container_name: codingagent-playwright
    restart: unless-stopped
    init: true
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - playwright:8931
      - --output-dir
      - /workspace/test-results
    volumes:
      - ./workspace:/workspace
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  discord-bridge:
    build:
      context: ./discord-bridge
      dockerfile: Dockerfile
    image: codingagent-discord-bridge:1.0
    container_name: codingagent-discord-bridge
    restart: unless-stopped
    init: true
    depends_on:
      - codingagent
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID in .env}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:?Set DISCORD_ALLOWED_USER_IDS in .env}
      DISCORD_ALLOWED_CHANNEL_IDS: ${DISCORD_ALLOWED_CHANNEL_IDS:?Set DISCORD_ALLOWED_CHANNEL_IDS in .env}
      OPENCODE_BASE_URL: http://codingagent:4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD in .env}
      OPENCODE_WORKSPACE: /workspace
      SESSION_STATE_FILE: /state/sessions.json
    volumes:
      - ./workspace:/workspace
      - discord-state:/state
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  opencode-config:
  opencode-data:
  opencode-cache:
  opencode-tools:
  discord-state:
